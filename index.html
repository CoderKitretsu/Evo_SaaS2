<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp SaaS – Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
      body { background:#f6f7fb; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      .container { max-width: 1100px; }
      .glass { background: rgba(255,255,255,0.9); box-shadow: 0 10px 25px rgba(0,0,0,0.07); backdrop-filter: blur(6px); }
      .btn-primary { background:#0f766e; color:#fff; }
      .btn-primary:hover { filter: brightness(0.95); }
      .badge { padding:2px 10px; border-radius:9999px; font-size:12px; }
      #qrImage { width:240px; height:240px; margin:12px auto; display:none; border:2px dashed #d1d5db; border-radius:12px; object-fit:contain; }
      #progressLog { max-height:260px; overflow-y:auto; border:1px solid #e5e7eb; border-radius:10px; padding:10px; background:#fafafa; font-size:13px; }
      .modal { position: fixed; inset: 0; display:none; }
      .modal.open { display:flex; }
    </style>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
